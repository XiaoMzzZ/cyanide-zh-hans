name: Build Cyanide

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Public Submodules
        run: |
          git config submodule.Cyanide/tweaks/private.update none
          git submodule update --init --recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make build script executable
        run: chmod +x ./build.sh ./scripts/build.sh ./scripts/gen-changelog.sh

      - name: Compile Cyanide (Unsigned)
        run: ./build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-TweakRunner
          # build/Cyanide.ipa 是软链接，upload-artifact 处理软链接不可靠，
          # 这里直接上传真实文件（Cyanide-<版本>.ipa）。
          path: build/Cyanide-*.ipa
          if-no-files-found: error
          retention-days: 7
